[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentmdlint"
version = "0.1.0"
description = "Offline maintainability linter for agent instruction files (AGENTS.md and similar)."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "the agentmdlint contributors" }]
keywords = ["agent", "instructions", "linter", "maintainability", "static-analysis"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = []

[project.scripts]
agentmdlint = "agentmdlint.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agentmdlint*"]
