[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "devcontainercheck"
version = "0.1.0"
description = "Static linter for devcontainer.json files - flags twelve shape defects enabling supply-chain, lifecycle-command, and host-escape attacks against VS Code / GitHub Codespaces / Dev Containers CLI consumers."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["devcontainer", "codespaces", "linter", "supply-chain", "ghostaction", "safety"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Security",
]

[project.scripts]
devcontainercheck = "devcontainercheck.cli:main"

[tool.setuptools.packages.find]
include = ["devcontainercheck*"]
exclude = ["tests*", "examples*"]
