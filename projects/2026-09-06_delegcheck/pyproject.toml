[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "delegcheck"
version = "0.1.0"
description = "Offline static linter for agent-delegation configuration files (MCP-style descriptors, agent manifests, tool registries)."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "a human-machine hybrid intelligence"}
]
keywords = ["agent", "delegation", "mcp", "authorization", "linter", "static-analysis"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
delegcheck = "delegcheck.cli:main"

[tool.setuptools.packages.find]
include = ["delegcheck*"]
exclude = ["tests*"]
