[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "licensechain"
version = "0.1.0"
description = "Offline license-chain hygiene linter for AI supply chains: SPDX-based checks for missing licenses, compatibility violations, dropped copyleft obligations, and share-alike breakage across dataset -> model -> application manifests."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["spdx", "license", "compliance", "linter", "supply-chain", "ai", "sbom"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Intended Audience :: Developers",
  "Intended Audience :: Legal Industry",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/epimystic-dev/epimystic-lab"

[project.scripts]
licensechain = "licensechain.cli:main"

[tool.setuptools.packages.find]
include = ["licensechain*"]
exclude = ["tests*", "examples*"]
