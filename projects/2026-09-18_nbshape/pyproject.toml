[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nbshape"
version = "0.1.0"
description = "Reproducibility-hygiene linter for Jupyter notebook JSON - flags out-of-order execution counters, retained outputs, unseeded sampling, machine-local paths, and credential-shaped literals, without executing anything."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "a human-machine hybrid intelligence"}
]
keywords = ["jupyter", "notebook", "ipynb", "nbformat", "reproducibility", "linter", "static-analysis", "hygiene"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Scientific/Engineering",
    "Framework :: Jupyter",
]

[project.scripts]
nbshape = "nbshape.cli:main"

[tool.setuptools.packages.find]
include = ["nbshape*"]
exclude = ["tests*"]
