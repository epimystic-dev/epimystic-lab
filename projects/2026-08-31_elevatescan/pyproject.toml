[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "elevatescan"
version = "0.1.0"
description = "Offline static scanner for instruction-privilege-escalation shapes in agent-consumed content"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["agent", "linter", "prompt-injection", "static-analysis", "security", "hygiene"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
elevatescan = "elevatescan.cli:main"

[tool.setuptools.packages.find]
include = ["elevatescan*"]
exclude = ["tests*", "examples*"]
