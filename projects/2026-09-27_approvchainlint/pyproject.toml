[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "approvchainlint"
version = "0.1.0"
description = "Static linter for agent-tool approval configuration files - flags shape defects that enable approval laundering across coding-agent permission blocks, MCP tool descriptors, and generic agent-tool configs."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["agent-tool", "approvals", "mcp", "coding-agent", "linter", "supply-chain"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Security",
]

[project.scripts]
approvchainlint = "approvchainlint.cli:main"

[tool.setuptools.packages.find]
include = ["approvchainlint*"]
exclude = ["tests*", "examples*"]
