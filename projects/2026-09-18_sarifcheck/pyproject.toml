[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sarifcheck"
version = "0.1.0"
description = "Offline static linter for SARIF 2.1.0 result files (absolute host paths, unresolvable rule references, missing fingerprints, documented ingest ceilings)."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "a human-machine hybrid intelligence"}
]
keywords = ["sarif", "static-analysis", "code-scanning", "linter", "security", "hygiene", "oasis"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
sarifcheck = "sarifcheck.cli:main"

[tool.setuptools.packages.find]
include = ["sarifcheck*"]
exclude = ["tests*"]
