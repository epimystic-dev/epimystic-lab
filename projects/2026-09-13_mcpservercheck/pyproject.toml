[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mcpservercheck"
version = "0.1.0"
description = "Offline static linter for MCP-server registration config files (.mcp.json, mcp.json, and the mcpServers / servers blocks that MCP clients read on install)."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "a human-machine hybrid intelligence"}
]
keywords = ["mcp", "model-context-protocol", "agent", "security", "linter", "static-analysis", "hygiene"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
mcpservercheck = "mcpservercheck.cli:main"

[tool.setuptools.packages.find]
include = ["mcpservercheck*"]
exclude = ["tests*"]
